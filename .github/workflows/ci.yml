name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Nilai dummy. Test unit tidak menyentuh database, tapi konfigurasi API
      # dan `prisma generate` menolak jalan kalau DATABASE_URL kosong.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attendance_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/attendance_test?schema=public
      JWT_SECRET: ci-only-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      VITE_API_BASE_URL: http://localhost:3000/attendance_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test API dan web
        run: npm run test

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build
